name: clang-format
on:
  pull_request:
  # SOH [fork] Allow running the format check by hand from the Actions tab.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install clang-format
        run: |
          # Chrome is preinstalled on hosted runners but is not a build dependency.
          # Ignore its repository to avoid unrelated index hash mismatches.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y clang-format-14
      - name: Run clang-format
        run: |
          ./run-clang-format.sh
          git diff --exit-code
